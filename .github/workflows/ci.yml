# CI (spec section 17). Suites that need a built server or a long run join as
# their steps land: replication (step 21), fuzz (step 22). The docker build
# joined in step 5, the differential suite in step 8, the crash suite in step 15.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The reference server for the differential suite (spec 15.3).
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --coverage
      - run: npm run test:diff
        env:
          OPS: '20000'
      - run: npm run test:crash
        env:
          KILLS: '10'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  docker:
    # Spec 17 item 5: prove the image builds. Pushing to GHCR comes later.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t miniredis:ci .
