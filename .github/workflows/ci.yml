# CI (spec section 17). The docker build joined in step 5, the differential suite in
# step 8, the crash suite in step 15, replication in step 21, the fuzzer in step 22.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The reference server for the differential suite (spec 15.3).
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --coverage
      - run: npm run test:diff
        env:
          OPS: '20000'
      # The same run with both connections in RESP3 (step 22).
      - run: npm run test:diff
        env:
          OPS: '20000'
          PROTO: '3'
      - run: npm run test:crash
        env:
          KILLS: '10'
      - run: npm run test:repl
      - run: npm run test:fuzz
        env:
          CASES: '100000'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  docker:
    # Spec 17 item 5: prove the image builds, on every push and pull request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t miniredis:ci .

  publish:
    # Spec 17 item 6: on a push to main, once every check above has passed, push the image to
    # GHCR tagged with the commit SHA and `latest`. Image names must be lowercase, hence `,,`.
    # The source label links the package to this repo, so it shows on the repo page.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
