# MiniRedis sample configuration (spec section 5). Every value here is the default.
#
#   node dist/index.js miniredis.conf --port 6390     # flags override the file
#
# One directive per line: name value [value ...]. Sizes take Redis's units: 1k = 1000,
# 1kb = 1024, 1m, 1mb, 1g, 1gb. Booleans are yes/no. Directives marked (mutable) can also be
# changed at runtime with CONFIG SET.

# --- Network -------------------------------------------------------------------------------
# not 6379, so it never clashes with a real Redis
port 6380
# 0.0.0.0 only inside Docker
bind 127.0.0.1
tcp-keepalive 300
# (mutable)
maxclients 10000
# close idle clients after N seconds; 0 = never (mutable)
timeout 0

# --- Security ------------------------------------------------------------------------------
# requirepass "a long random password"   # (mutable) empty = no AUTH
# Enable DEBUG only for tests: it can block the server and reload data.
enable-debug-command no

# --- General -------------------------------------------------------------------------------
databases 16
# serverCron runs per second (mutable)
hz 10
# debug, verbose, notice, warning (mutable)
loglevel notice

# --- Persistence ---------------------------------------------------------------------------
# every file MiniRedis writes; can't change at runtime
dir ./data
dbfilename dump.mrdb
# snapshot after N seconds if at least M changes; "" = off (mutable)
save 3600 1 300 100 60 10000
# turning it on at runtime starts a rewrite (mutable)
appendonly no
appendfilename appendonly.aof
# always, everysec or no (mutable)
appendfsync everysec
# (mutable)
aof-load-truncated yes
# (mutable)
auto-aof-rewrite-percentage 100
# (mutable)
auto-aof-rewrite-min-size 64mb

# --- Memory --------------------------------------------------------------------------------
# bytes; 0 = no limit (mutable)
maxmemory 0
# noeviction, allkeys-lru, volatile-lru, allkeys-lfu, volatile-lfu, allkeys-random,
# volatile-random or volatile-ttl (mutable)
maxmemory-policy noeviction
# (mutable)
maxmemory-samples 5
# (mutable)
lfu-log-factor 10
# (mutable)
lfu-decay-time 1
# items per quicklist node (mutable)
list-max-node-items 128

# --- Limits --------------------------------------------------------------------------------
# Redis: 512mb; V8 strings top out just under that (mutable)
proto-max-bulk-len 64mb
# (mutable)
client-query-buffer-limit 256mb
# (mutable)
client-output-buffer-limit normal 0 0 0 replica 256mb 64mb 60 pubsub 32mb 8mb 60

# --- Observability -------------------------------------------------------------------------
# microseconds (mutable)
slowlog-log-slower-than 10000
# (mutable)
slowlog-max-len 128
# Prometheus /metrics on this port; 0 = off
metrics-port 0

# --- Replication ---------------------------------------------------------------------------
# replicaof 127.0.0.1 6381        # follow a primary (or use REPLICAOF at runtime)
# masterauth "the primary's password"   # (mutable)
# (mutable)
replica-read-only yes
# (mutable)
repl-backlog-size 1mb
# (mutable)
repl-timeout 60
# (mutable)
repl-ping-replica-period 10
